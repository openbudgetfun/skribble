name: Changeset policy

on:
  pull_request:
    branches: [main]

concurrency:
  group: changeset-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: validate monochange config and changesets
        run: monochange step validate
        shell: devenv shell -- bash -e {0}

      - name: check changeset and manifest policy
        run: monochange check
        shell: devenv shell -- bash -e {0}
