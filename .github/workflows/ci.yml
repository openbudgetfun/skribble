name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the previous run for the same ref: cancel it instead
# of paying for a full result nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-asset-policy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Keep Figma exports in release assets
        shell: bash
        run: |
          if git ls-files -- ':(icase)*.fig' | grep -q .; then
            echo 'Figma exports must be attached to the latest release, not committed.'
            git ls-files -- ':(icase)*.fig'
            exit 1
          fi

  # The zero-Material endgame is tracked by docs/material-dependency-audit.txt.
  # The rewrite lands one widget at a time, so instead of failing every PR
  # until the count reaches zero this job is a ratchet: it fails only when the
  # debt grows past the committed baseline in
  # docs/material-dependency-baseline.json. Debt going down is always allowed;
  # only an increase needs a deliberate baseline refresh, explained in the PR.
  material-debt-ratchet:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Committed audit report matches a fresh run
        run: |
          dart run tool/audit_material_dependencies.dart > "$RUNNER_TEMP/audit.txt"
          if ! diff -u docs/material-dependency-audit.txt "$RUNNER_TEMP/audit.txt"; then
            echo 'docs/material-dependency-audit.txt is stale. Regenerate it with:'
            echo '  dart run tool/audit_material_dependencies.dart > docs/material-dependency-audit.txt'
            exit 1
          fi
        shell: devenv shell -- bash -e {0}
      - name: Material debt does not grow past the baseline
        run: |
          dart run tool/audit_material_dependencies.dart --check --baseline docs/material-dependency-baseline.json
        shell: devenv shell -- bash -e {0}

  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Includes `monochange check`, so the changeset and manifest policy runs
      # here as well as in the Changeset policy workflow.
      - name: lint all
        run: lint:all
        shell: devenv shell -- bash -e {0}

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: test
        run: test:all
        shell: devenv shell -- bash -e {0}

  rough-icons-regression:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      ROUGH_ICONS_MAX_NEW_UNRESOLVED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: rough icons unresolved regression gate
        run: ./scripts/check_rough_icons_ci.sh regression
        shell: devenv shell -- bash -e {0}
      - name: upload rough icons unresolved report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rough-icons-unresolved-report
          path: packages/skribble/unresolved-report.json
          if-no-files-found: ignore

  rough-icons-baseline-sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run unresolved baseline sync check
        run: ./scripts/check_rough_icons_ci.sh baseline-sync
        shell: devenv shell -- bash -e {0}
      - name: upload unresolved baseline diff artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rough-icons-baseline-sync-diff
          path: rough-icons-baseline-sync.diff
          if-no-files-found: ignore

  rough-icons-generated-sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      ROUGH_ICONS_MAX_NEW_UNRESOLVED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run rough icon catalog sync check
        run: ./scripts/check_rough_icons_ci.sh generated-sync
        shell: devenv shell -- bash -e {0}
      - name: upload rough icon catalog diff artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rough-icons-generated-sync-diff
          path: rough-icons-generated-sync.diff
          if-no-files-found: ignore

  font-roughener:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run font roughener tests
        run: |
          (cd packages/skribble_font_roughen && dart test)
          dart run tool/casual_font_experiment.dart
          dart run packages/skribble_font_roughen/bin/verify_exploration.dart
          dart run tool/font_exploration_specimen.dart
        shell: devenv shell -- bash -e {0}
      - name: upload experimental fonts and comparison
        uses: actions/upload-artifact@v4
        with:
          name: font-exploration
          include-hidden-files: true
          path: |
            .screenshots/font-exploration/*.ttf
            .screenshots/font-exploration/OFL.txt
            .screenshots/font-exploration/README.txt
            .screenshots/font-exploration/comparison.html
            .screenshots/font-exploration/verification.json
          if-no-files-found: error

  visual-assets-sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test SVG import and rebuild pinned visual assets
        run: |
          (cd packages/skribble_emoji_gen && dart test)
          dart run packages/skribble_emoji_gen/bin/update_assets.dart
          dart run packages/skribble_font_roughen/bin/roughen_fonts.dart --check
          dart run tool/docs_font_comparison.dart --check
          dart run packages/skribble/tool/generate_rough_icons.dart --kit svg-manifest --manifest packages/skribble/tool/brands/manifest.json --output packages/skribble/lib/src/generated/brand_rough_icons.g.dart --map-name kBrandRoughIcons
          dart format packages/skribble/lib/src/generated/brand_rough_icons.g.dart
          git diff --exit-code -- packages/skribble/lib/src/generated/brand_rough_icons.g.dart
          (cd docs/site && dart run tool/generate_examples.dart --check)
          git diff --exit-code -- packages/skribble_font_recursive/assets/fonts packages/skribble/tool/font apps/skribble_storybook/assets/fonts packages/skribble_emoji/lib/src/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/skribble_font_recursive/assets/fonts packages/skribble/tool/font apps/skribble_storybook/assets/fonts packages/skribble_emoji/lib/src/generated)"
        shell: devenv shell -- bash -e {0}

  # The icon catalogs regenerate in pure Dart in seconds, so CI re-derives every
  # one of them rather than trusting that a contributor ran the generator.
  icon-catalogs-sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: verify committed icon catalogs match their generators
        run: ./scripts/check_icon_catalogs.sh
        shell: devenv shell -- bash -e {0}
      - name: confirm no catalog files are untracked
        run: |
          test -z "$(git ls-files --others --exclude-standard -- \
            packages/skribble_icons_curated/lib/src/generated \
            packages/skribble_icons_lucide/lib/src/generated \
            packages/skribble_icons_bxs/lib/src/generated \
            packages/skribble_icons_cib/lib/src/generated)"
        shell: devenv shell -- bash -e {0}

  # Icon catalogs are the packages most likely to creep past pub.dev's size
  # guidance, so every PR measures the real compressed archive.
  package-sizes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: verify publishable packages stay inside their size budgets
        run: ./scripts/check_package_sizes.sh
        shell: devenv shell -- bash -e {0}

  patrol-web:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium system libraries
        run: npx --yes playwright@1.56.0 install --with-deps chromium
      - name: Run notebook and catalog journeys in Chromium
        run: |
          export PATH="$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin:$PATH"
          dart pub global activate patrol_cli 4.7.0
          cd apps/skribble_storybook
          dart pub global run patrol_cli:main test --verbose --device chrome --target integration_test/quality_test.dart --target integration_test/patrol_test.dart --target integration_test/charts_test.dart --target integration_test/maps_test.dart --web-headless --web-server-timeout 300 --web-locale en-GB --web-screenshot on --web-trace retain-on-failure --web-workers 1 --web-reporter '["html", "json", "list"]'
        shell: bash
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-web-quality
          path: |
            apps/skribble_storybook/test-results/
            apps/skribble_storybook/playwright-report/
          if-no-files-found: warn

  docs-web:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Flutter docs with a deployment prefix
        run: docs:site:build --base-href=/skribble/
        shell: devenv shell -- bash -e {0}
      - name: Install Chromium system libraries
        run: npx --yes playwright@1.56.0 install --with-deps chromium
      - name: Exercise navigation, examples, and browser clipboard
        run: |
          export PATH="$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin:$PATH"
          dart pub global activate patrol_cli 4.7.0
          cd docs/site
          dart pub global run patrol_cli:main test --verbose --device chrome --target integration_test/docs_test.dart,integration_test/interactive_examples_test.dart,integration_test/charts_test.dart,integration_test/maps_test.dart --web-headless --web-server-timeout 300 --web-locale en-GB --web-screenshot on --web-trace retain-on-failure --web-workers 1
        shell: bash
      - name: Upload documentation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-web-quality
          path: |
            docs/site/test-results/
            docs/site/playwright-report/
          if-no-files-found: warn

  coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: coverage
        run: test:coverage
        shell: devenv shell -- bash -e {0}
      - name: upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true

  publish-check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Runs `flutter/dart pub publish --dry-run` for every package against
      # pub.dev, the same validation the publish workflow performs before
      # each real publish.
      - name: Dry-run package publishing
        run: monochange step publish-packages --dry-run --all --format json
        shell: devenv shell -- bash -e {0}

  # Validates the release path on every pull request and every push to main:
  # build the release commit a local `monochange run release` would produce,
  # then dry-run the publish against it. Nothing is pushed, tagged, or
  # published.
  #
  # The release commit is only built when the branch has more than one pending
  # changeset. A single changeset is a trivial bump; the interesting failures
  # live in the cross-package version sync that multiple changesets trigger.
  # Raise or lower MIN_CHANGESETS to change that threshold.
  release-publish:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      MIN_CHANGESETS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure release identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash
      # Simulate the release commit a local release would create from this
      # branch: prepare version bumps and changelogs, then commit them
      # locally. Nothing is pushed, tagged, or published.
      - name: Create the release commit locally
        id: release_commit
        run: |
          set -euo pipefail
          changesets="$(find .changeset -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "Pending changesets: $changesets (threshold: >= $MIN_CHANGESETS)"
          if [ "$changesets" -lt "$MIN_CHANGESETS" ]; then
            echo "Below the changeset threshold; skipping the local release commit."
            exit 0
          fi
          monochange step prepare-release --release-json --format json
          monochange step commit-release --no-verify
          echo "created=true" >>"$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}
      - name: Check publish readiness on the release commit
        if: steps.release_commit.outputs.created == 'true'
        run: monochange step publish-readiness --from HEAD --format json
        shell: devenv shell -- bash -e {0}
      - name: Dry-run package publishing on the release commit
        run: monochange step publish-packages --dry-run --format json
        shell: devenv shell -- bash -e {0}
