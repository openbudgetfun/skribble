name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint all
        run: lint:all
        shell: devenv shell -- bash -e {0}
      - name: Validate monochange configuration
        run: monochange step validate
        shell: devenv shell -- bash -e {0}

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: test
        run: test:all
        shell: devenv shell -- bash -e {0}

  rough-icons-regression:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      ROUGH_ICONS_MAX_NEW_UNRESOLVED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: rough icons unresolved regression gate
        run: ./scripts/check_rough_icons_ci.sh regression
        shell: devenv shell -- bash -e {0}
      - name: upload rough icons unresolved report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rough-icons-unresolved-report
          path: packages/skribble/unresolved-report.json
          if-no-files-found: ignore

  rough-icons-baseline-sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run unresolved baseline sync check
        run: ./scripts/check_rough_icons_ci.sh baseline-sync
        shell: devenv shell -- bash -e {0}
      - name: upload unresolved baseline diff artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rough-icons-baseline-sync-diff
          path: rough-icons-baseline-sync.diff
          if-no-files-found: ignore

  rough-icons-generated-sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      ROUGH_ICONS_MAX_NEW_UNRESOLVED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run rough icon catalog sync check
        run: ./scripts/check_rough_icons_ci.sh generated-sync
        shell: devenv shell -- bash -e {0}
      - name: upload rough icon catalog diff artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rough-icons-generated-sync-diff
          path: rough-icons-generated-sync.diff
          if-no-files-found: ignore

  font-roughener:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: run font roughener tests
        run: |
          cd packages/skribble_font_roughen
          dart test
        shell: devenv shell -- bash -e {0}

  visual-assets-sync:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test SVG import and rebuild pinned visual assets
        run: |
          (cd packages/skribble_emoji_gen && dart test)
          dart run packages/skribble_emoji_gen/bin/update_assets.dart
          dart run packages/skribble_font_roughen/bin/roughen_fonts.dart --check
          dart run tool/docs_font_comparison.dart --check
          dart run packages/skribble/tool/generate_rough_icons.dart --kit svg-manifest --manifest packages/skribble/tool/brands/manifest.json --output packages/skribble/lib/src/generated/brand_rough_icons.g.dart --map-name kBrandRoughIcons
          dart format packages/skribble/lib/src/generated/brand_rough_icons.g.dart
          git diff --exit-code -- packages/skribble/lib/src/generated/brand_rough_icons.g.dart
          (cd docs/site && dart run tool/generate_examples.dart --check)
          git diff --exit-code -- packages/skribble/assets/fonts packages/skribble/tool/font apps/skribble_storybook/assets/fonts packages/skribble_emoji/lib/src/generated packages/skribble_icons/lib/src/generated/skribble_icons_rough.g.dart
          test -z "$(git ls-files --others --exclude-standard -- packages/skribble/assets/fonts packages/skribble/tool/font apps/skribble_storybook/assets/fonts packages/skribble_emoji/lib/src/generated packages/skribble_icons/lib/src/generated)"
        shell: devenv shell -- bash -e {0}

  patrol-web:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium system libraries
        run: npx --yes playwright@1.56.0 install --with-deps chromium
      - name: Run notebook and catalog journeys in Chromium
        run: |
          export PATH="$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin:$PATH"
          dart pub global activate patrol_cli 4.7.0
          cd apps/skribble_storybook
          dart pub global run patrol_cli:main test --verbose --device chrome --target integration_test/quality_test.dart --target integration_test/patrol_test.dart --web-headless --web-server-timeout 300 --web-locale en-GB --web-screenshot on --web-trace retain-on-failure --web-workers 1 --web-reporter '["html", "json", "list"]'
        shell: bash
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-web-quality
          path: |
            apps/skribble_storybook/test-results/
            apps/skribble_storybook/playwright-report/
          if-no-files-found: warn

  docs-web:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Flutter docs with a deployment prefix
        run: docs:site:build --base-href=/skribble/
        shell: devenv shell -- bash -e {0}
      - name: Install Chromium system libraries
        run: npx --yes playwright@1.56.0 install --with-deps chromium
      - name: Exercise navigation, examples, and browser clipboard
        run: |
          export PATH="$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin:$PATH"
          dart pub global activate patrol_cli 4.7.0
          cd docs/site
          dart pub global run patrol_cli:main test --verbose --device chrome --target integration_test/docs_test.dart,integration_test/interactive_examples_test.dart --web-headless --web-server-timeout 300 --web-locale en-GB --web-screenshot on --web-trace retain-on-failure --web-workers 1
        shell: bash
      - name: Upload documentation browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-web-quality
          path: |
            docs/site/test-results/
            docs/site/playwright-report/
          if-no-files-found: warn

  coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: coverage
        run: test:coverage
        shell: devenv shell -- bash -e {0}
      - name: upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
