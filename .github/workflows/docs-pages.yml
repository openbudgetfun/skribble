name: Docs Pages

# The website (the landing page, the docs under docs/, and the storybook
# under docs/storybook/) deploys with releases, not with every push to main.
# The publish workflow dispatches this workflow on `main` with the release tag,
# because the github-pages environment only accepts deployments from `main`:
# a run started by the tag push itself could not deploy. Dispatch it by hand
# with no tag to redeploy the tip of main.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build (for example v0.4.0 or skribble_site/v1.1.0); empty builds the dispatched branch
        required: false
        default: ""
        type: string
      base_path:
        description: Optional base path override for GitHub Pages (for example /skribble/ or /)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
      - name: Verify the release tag is on main
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$(git rev-list -n1 "refs/tags/$RELEASE_TAG")" refs/remotes/origin/main; then
            echo "::error::$RELEASE_TAG is not reachable from main."
            exit 1
          fi
          echo "Deploying the website at $RELEASE_TAG" >>"$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: pages
        uses: actions/configure-pages@v6
      - name: Resolve the site base path and URL
        id: base
        run: |
          input_base='${{ inputs.base_path }}'
          configured_url='${{ steps.pages.outputs.base_url }}'
          configured_base='${{ steps.pages.outputs.base_path }}'

          # configure-pages reports an empty base path for a custom domain
          # (https://skribble.dev), so trust it whenever it reported a URL.
          if [[ -n "$input_base" ]]; then
            base_path="$input_base"
          elif [[ -n "$configured_url" ]]; then
            base_path="${configured_base:-/}"
          elif [[ "${GITHUB_REPOSITORY#*/}" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base_path='/'
          else
            base_path="/${GITHUB_REPOSITORY#*/}/"
          fi

          if [[ "$base_path" != "/" ]]; then
            [[ "$base_path" != /* ]] && base_path="/$base_path"
            [[ "$base_path" != */ ]] && base_path="$base_path/"
          fi

          site_url="${configured_url:-https://${GITHUB_REPOSITORY_OWNER}.github.io${base_path%/}}"

          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          echo "Using base path $base_path for $site_url"
      # Layout: the Jaspr landing page at the root, the Flutter docs under
      # docs/, and the storybook under docs/storybook/ (the docs app opens
      # it relative to its own base).
      - name: Build docs site
        run: docs:site:build --base-href=${{ steps.base.outputs.base_path }}docs/
        shell: devenv shell -- bash -e {0}
      - name: Build storybook web preview
        run: |
          # --no-tree-shake-icons: the icon galleries render runtime
          # codepoints (thousands of them), which the const-arg shaker
          # cannot evaluate.
          flutter build web --release --no-web-resources-cdn --no-tree-shake-icons --base-href "${{ steps.base.outputs.base_path }}docs/storybook/" --pwa-strategy=none
        working-directory: apps/skribble_storybook
        shell: devenv shell -- bash -e {0}
      - name: Build the landing page
        run: dart run apps/skribble_site/bin/build.dart --output=build/pages --base-path=${{ steps.base.outputs.base_path }} --site-url=${{ steps.base.outputs.site_url }}
        shell: devenv shell -- bash -e {0}
      - name: Assemble the Pages artifact
        run: |
          mkdir -p build/pages/docs/storybook
          cp -R docs/site/build/web/. build/pages/docs/
          cp -R apps/skribble_storybook/build/web/. build/pages/docs/storybook/
          # GitHub Pages serves only the root 404.html; the landing page's
          # sends old documentation links on to docs/.
          rm -f build/pages/docs/404.html
        shell: bash
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
