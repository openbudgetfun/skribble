name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Analysis, formatting, and tests already run in the CI workflow, where
      # they block the pull request. Repeating them here produced a second,
      # non-blocking copy of the same result, so this job reports only what CI
      # does not: which changed widgets lack a same-named test file.
      - name: run analysis
        id: analysis
        run: |
          set -e
          mkdir -p .audit

          echo "## Automated PR Review" > .audit/review.md
          echo "" >> .audit/review.md

          # Check for missing tests
          echo "### Widget test file inventory" >> .audit/review.md
          changed_files=$(git diff --name-only origin/main...HEAD -- 'packages/skribble/lib/src/wired_*.dart' | sed 's|lib/src/|test/widgets/|' | sed 's|\.dart|_test.dart|')
          missing_tests=""
          for test_file in $changed_files; do
            full_path="$test_file"
            if [ ! -f "$full_path" ]; then
              missing_tests="$missing_tests\n- \`$full_path\`"
            fi
          done

          if [ -n "$missing_tests" ]; then
            echo "No same-named test file for the following sources (coverage may exist in another test file):" >> .audit/review.md
            echo -e "$missing_tests" >> .audit/review.md
          else
            echo "All changed widgets have corresponding test files." >> .audit/review.md
          fi

          echo "" >> .audit/review.md
          echo "---" >> .audit/review.md
          echo "*This review was generated automatically by the Skribble CI pipeline.*" >> .audit/review.md
        shell: devenv shell -- bash -e {0}

      - name: post review comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: .audit/review.md
