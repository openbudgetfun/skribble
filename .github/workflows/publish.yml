name: Publish

on:
  push:
    tags:
      - "v*"
      - "skribble_maps/v*"
      - "skribble_charts/v*"
      - "js/v*"
      - "skribble_site/v*"
  # pub.dev only accepts automated publishing from runs triggered by a tag
  # push, so a dispatch cannot publish packages. Keep it for re-running the
  # non-registry repair steps (GitHub releases and font assets) at an existing
  # release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pub-dev-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'openbudgetfun/skribble'
    environment: publisher
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$(git rev-list -n1 "$RELEASE_TAG")" ]; then
            echo "::error::The checkout does not match $RELEASE_TAG."
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main --tags
          if ! git merge-base --is-ancestor "$(git rev-list -n1 "$RELEASE_TAG")" refs/remotes/origin/main; then
            echo "::error::$RELEASE_TAG is not reachable from main."
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The website's `skribble_site/v*` tag owns no package that goes to a
      # registry, so its run skips straight to the GitHub release.
      - name: Find the packages this tag publishes
        id: owned
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          members="$(monochange step release-record --from HEAD --format json |
            jq -c --arg tag "$RELEASE_TAG" '[.record.release_targets[] | select(.tag_name == $tag) | .members[]]')"
          publishable="$(monochange step config --format json |
            jq -c '[.config.packages[] | select(.publish.enabled != false) | .id]')"
          count="$(jq -n --argjson members "$members" --argjson publishable "$publishable" \
            '[$members[] | select(. as $member | $publishable | index($member))] | length')"
          echo "registry=$([ "$count" -gt 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      # Readiness dry-runs `npm publish` for every npm package in the release
      # record, whichever tag is being published, and each dry run builds the
      # package in its `prepack` script. A release commit without npm packages
      # needs none of this, so a Dart-only release skips the install.
      - name: Check whether the release includes npm packages
        if: steps.owned.outputs.registry == 'true'
        id: npm
        run: |
          count="$(monochange step release-record --from HEAD --format json |
            jq '[.record.package_publications[]? | select(.ecosystem == "npm")] | length')"
          echo "packages=$count" >>"$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: Install npm workspace dependencies
        if: steps.owned.outputs.registry == 'true' && steps.npm.outputs.packages != '0'
        run: pnpm install --frozen-lockfile
        shell: devenv shell -- bash -e {0}

      # npm trusted publishing (OIDC, through the `id-token: write` permission)
      # needs npm 11.5.1 or newer.
      - name: Check the npm version for trusted publishing
        if: startsWith(inputs.tag || github.ref_name, 'js/')
        run: |
          version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $version cannot use trusted publishing; it needs 11.5.1 or newer."
            exit 1
          fi
          echo "npm $version"
        shell: devenv shell -- bash -e {0}

      - name: Check Monochange publish readiness
        if: steps.owned.outputs.registry == 'true'
        run: |
          monochange step publish-readiness \
            --from HEAD \
            --output "$RUNNER_TEMP/publish-readiness.json" \
            --format json
        shell: devenv shell -- bash -e {0}

      # setup-dart registers a pub.dev credential for every pub.dev request that
      # follows it (`dart pub token add https://pub.dev --env-var PUB_TOKEN`),
      # and pub.dev rejects dependency resolution with that publish-scoped
      # credential. Every anonymous pub.dev read therefore has to happen first:
      # the flutter tool bootstrap inside the toolchains step and the readiness
      # check above both resolve packages, so this step belongs directly before
      # the publishes it authenticates.
      - name: Set up Dart trusted publishing
        if: steps.owned.outputs.registry == 'true'
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2

      # pub.dev configures automated publishing per package, and each package
      # only accepts its own tag pattern, so every tag publishes just the
      # release targets it owns: the main group for `v<version>`, the single
      # companion package for its namespaced tag, and the npm packages for
      # `js/v<version>`. Re-runs skip versions that already exist on the
      # registry.
      #
      # The script publishes one package per invocation because monochange
      # aborts the whole batch on the first failure. That is how v0.2.0 and
      # v0.2.1 each left 11 of the group's 13 packages blocked: publishing
      # stopped on `skribble_font_recursive`, which answered "publishing from
      # github is not enabled" — a registry-side automated-publishing rule that
      # only pub.dev's own admin page can confirm, and one the readiness check
      # cannot see (it reports `manual_verification_required` for every package
      # that already exists). Isolating each publish, then verifying the
      # registry state, names the packages that still need publishing instead
      # of reporting a bare error.
      #
      # The readiness report computed above is passed through rather than
      # recomputed: the script needs its dependency-corrected order, and
      # computing that order runs `pub publish` dry runs, which resolve
      # dependencies — work that must happen before the publish credential is
      # registered.
      #
      # The script is read from `origin/main`, not from the checked-out tag.
      # Every tag cut before it was added predates the file, so running the
      # tag's own copy would fail with "No such file or directory" — exactly
      # the recovery path this step exists to serve. The script takes the
      # release record and package manifests from the working tree, so the
      # release it publishes is still the tag's, not main's.
      - name: Publish the packages this tag owns
        if: steps.owned.outputs.registry == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          runner="$RUNNER_TEMP/publish_owned_packages.sh"
          git show origin/main:scripts/release/publish_owned_packages.sh >"$runner"
          chmod +x "$runner"
          "$runner" "$RELEASE_TAG" --readiness "$RUNNER_TEMP/publish-readiness.json"
        shell: devenv shell -- bash -e {0}

      - name: Publish the GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          monochange step publish-release \
            --from-ref HEAD \
            --format json | tee "$RUNNER_TEMP/publish-release.json"
        shell: devenv shell -- bash -e {0}

      # Font zips belong to the main group's `v<version>` release only;
      # companion tags (skribble_maps/v*, skribble_charts/v*) skip this step.
      # This runs after the GitHub releases exist, and packages from the tag's
      # committed fonts, so local and automated releases attach identical
      # archives.
      - name: Attach the font zips to the release
        if: startsWith(inputs.tag || github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/release/publish_fonts.sh "$RELEASE_TAG"
        shell: devenv shell -- bash -e {0}

      # The animated emoji, exported as Lottie files from the tag's sources.
      - name: Attach the animated emoji to the release
        if: startsWith(inputs.tag || github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/release/publish_emoji_lottie.sh "$RELEASE_TAG"
        shell: devenv shell -- bash -e {0}

      - name: Upload Monochange publication reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monochange-publish-reports
          path: |
            ${{ runner.temp }}/publish-readiness.json
            ${{ runner.temp }}/publish-release.json
          if-no-files-found: ignore
          retention-days: 14

  # Every release deploys the website: the landing page, the docs, and the
  # storybook. This job does not wait for the registry publish, so a pub.dev
  # rejection never holds back the site. Only one tag per release commit
  # dispatches the deploy; see scripts/release/deploy_website.sh.
  website:
    if: github.repository == 'openbudgetfun/skribble'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Read from `origin/main` for the same reason as the publish script:
      # tags cut before the script existed do not carry it.
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main
          runner="$RUNNER_TEMP/deploy_website.sh"
          git show origin/main:scripts/release/deploy_website.sh >"$runner"
          chmod +x "$runner"
          "$runner" "$RELEASE_TAG"
        shell: bash
