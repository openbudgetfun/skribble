name: Release PR

# Every push to main opens or refreshes the release pull request from the
# pending changesets. Merging that pull request is a release commit, which a
# maintainer tags with `publish:tags` so the publish workflow releases it.
# `monochange run release` remains available for a release from a local
# checkout.
#
# The workflow pushes and opens the pull request with GITHUB_TOKEN, and GitHub
# starts no workflows for that token's pushes, pull requests, or tags: close
# and reopen the release pull request to run CI on it, and push the release
# tags from a local checkout. A credential whose pushes do start workflows
# would let this workflow do both.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'openbudgetfun/skribble'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure release identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin
        shell: bash

      - name: Detect a merged release commit
        id: release_record
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if is_release_commit="$(
            monochange step release-record \
              --from HEAD \
              --format json \
              --jq '.resolved_commit == .record_commit' \
              2>"$error_file"
          )"; then
            echo "is_release_commit=$is_release_commit" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          commit_body="$(git log -1 --pretty=%B)"
          if grep -q '<!-- monochange:release-record:start -->' <<<"$commit_body"; then
            echo "::error::The release record in HEAD could not be read."
            sed -n '1,120p' "$error_file" >&2
            exit 1
          fi

          echo "is_release_commit=false" >>"$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: Point at the release tags
        if: steps.release_record.outputs.is_release_commit == 'true'
        run: |
          message="Release commit: push its tags with publish:tags from a checkout of this commit to publish it."
          echo "::notice title=Release commit::${message}"
          echo "${message}" >>"$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Detect pending changesets
        id: changesets
        if: steps.release_record.outputs.is_release_commit != 'true'
        run: |
          if find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Configure GitHub authentication
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
        shell: bash

      # A release branch left from an earlier pull request must be known
      # locally, or the force-with-lease push that refreshes it is rejected as
      # stale.
      - name: Fetch existing release branches
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        run: git fetch --force origin '+refs/heads/chore/release/*:refs/remotes/origin/chore/release/*'
        shell: bash

      - name: Open or refresh the release PR
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A changeset that only bumps `none` produces no releaseable
          # packages; monochange exits non-zero with that message. Treat that
          # specific case as "nothing to release" rather than failing the
          # workflow. Any other failure is re-raised.
          if ! output="$(monochange run release-pr 2>&1)"; then
            if printf '%s\n' "$output" | grep -q 'no releaseable packages were found in discovered changesets'; then
              echo "No releaseable packages in current changesets; skipping release PR refresh."
              exit 0
            fi
            printf '%s\n' "$output" >&2
            exit 1
          fi
          printf '%s\n' "$output"
        shell: devenv shell -- bash -e {0}

      - name: Add release PR attribution
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list \
              --base main \
              --state open \
              --json headRefName,number \
              --jq '[.[] | select(.headRefName | startswith("chore/release"))][0].number'
          )"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No open release PR to attribute."
            exit 0
          fi

          body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .body)"
          attribution='Created on behalf of Ifiok Jr. (`@ifiokjr`) by the Release PR workflow, set up with Claude Opus 5.5 (medium thinking).'
          if ! grep -Fq "$attribution" <<<"$body"; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              --field body="${body}"$'\n\n'"${attribution}" \
              >/dev/null
          fi
        shell: bash
