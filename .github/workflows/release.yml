name: Release

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Output format"
        required: false
        default: "markdown"
        type: choice
        options:
          - text
          - json
          - markdown
      commit:
        description: "Commit the release changes"
        required: false
        default: false
        type: boolean
      push:
        description: "Push the release after commit"
        required: false
        default: false
        type: boolean
      tag:
        description: "Create and push release tags"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Publish GitHub release"
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run release workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mc release \
            --format ${{ inputs.format }} \
            --commit ${{ inputs.commit }} \
            --push ${{ inputs.push }} \
            --tag ${{ inputs.tag }} \
            --publish-release ${{ inputs.publish_release }}
        shell: devenv shell -- bash -e {0}
