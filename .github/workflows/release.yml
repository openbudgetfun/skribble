name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'openbudgetfun/skribble'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      is_release_commit: ${{ steps.release_record.outputs.is_release_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure release identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin
        shell: bash

      - name: Detect a merged release commit
        id: release_record
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if is_release_commit="$(
            monochange step release-record \
              --from HEAD \
              --format json \
              --jq '.resolved_commit == .record_commit' \
              2>"$error_file"
          )"; then
            echo "is_release_commit=$is_release_commit" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          commit_body="$(git log -1 --pretty=%B)"
          if grep -q '<!-- monochange:release-record:start -->' <<<"$commit_body"; then
            echo "::error::The release record in HEAD could not be read."
            sed -n '1,120p' "$error_file" >&2
            exit 1
          fi

          echo "is_release_commit=false" >>"$GITHUB_OUTPUT"
        shell: devenv shell -- bash -e {0}

      - name: Detect pending changesets
        id: changesets
        if: steps.release_record.outputs.is_release_commit != 'true'
        run: |
          if find .changeset -type f -name '*.md' -print -quit | grep -q .; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Configure GitHub authentication
        if: steps.release_record.outputs.is_release_commit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
        shell: bash

      - name: Open or refresh the release PR
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange run release
        shell: devenv shell -- bash -e {0}

      - name: Add release PR attribution
        if: steps.release_record.outputs.is_release_commit != 'true' && steps.changesets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list \
              --base main \
              --state open \
              --json headRefName,number \
              --jq '[.[] | select(.headRefName | startswith("chore/release"))][0].number'
          )"
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "::error::Monochange did not leave an open release PR."
            exit 1
          fi

          body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .body)"
          attribution='Created on behalf of Ifiok Jr. (@ifiokjr) by Codex using GPT-5 at an unreported thinking level.'
          if ! grep -Fq "$attribution" <<<"$body"; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              --field body="${body}"$'\n\n'"${attribution}" \
              >/dev/null
          fi
        shell: bash

  tag:
    if: github.repository == 'openbudgetfun/skribble' && needs.update.outputs.is_release_commit == 'true'
    needs: update
    environment: publisher
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure release authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: Create release tag and dispatch publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          monochange step tag-release --from HEAD --push=true --format json

          mapfile -t main_tags < <(git tag --points-at HEAD --list 'v[0-9]*')
          mapfile -t maps_tags < <(git tag --points-at HEAD --list 'skribble_maps/v[0-9]*')
          release_tags=("${main_tags[@]}" "${maps_tags[@]}")
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "::error::Expected at least one release tag at HEAD."
            exit 1
          fi

          release_commit="$(git rev-parse HEAD)"
          for release_tag in "${release_tags[@]}"; do
            previous_run_id="$(
              gh run list \
                --workflow publish.yml \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // 0'
            )"
            gh workflow run publish.yml --ref "$release_tag"

            run_id=""
            for _ in {1..30}; do
              run_id="$(
                gh run list \
                  --workflow publish.yml \
                  --event workflow_dispatch \
                  --limit 20 \
                  --json databaseId,headSha \
                  --jq "[.[] | select(.databaseId > $previous_run_id and .headSha == \"$release_commit\")][0].databaseId // empty"
              )"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "$run_id" ]; then
              echo "::error::Could not find the publish run for $release_tag."
              exit 1
            fi

            gh run watch "$run_id" --exit-status
          done
        shell: devenv shell -- bash -e {0}
