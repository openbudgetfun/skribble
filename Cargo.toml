[workspace]
members = ["rust/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr."]
edition = "2024"
homepage = "https://openbudgetfun.github.io/skribble/"
license = "MIT"
repository = "https://github.com/openbudgetfun/skribble"
rust-version = "1.88.0"

[workspace.dependencies]
skribble_leptoskit = { path = "rust/leptoskit", version = "0.1.0" }
skribble_rough = { path = "rust/rough", version = "0.1.0" }

leptos = { version = "0.9.0-rc1", default-features = false }
# The leptoskit requirements stay crates.io ranges so consumers stay free to
# choose their own leptoskit commit. This workspace's own builds and tests
# follow leptoskit's `main`, which is ahead of the published 0.3 releases,
# through the `[patch.crates-io]` section below; bump `rev` there, and only
# there, to follow leptoskit's `main`. Consumers add the same entries to
# their own root manifest; see `rust/leptoskit/README.md`.
leptoskit = { version = "0.3.0", default-features = false }
leptoskit_native = { version = "0.3.0", default-features = false }
leptoskit_testing = { version = "0.3.0" }
serde_json = { version = "1", features = ["float_roundtrip"] }

# `[patch]` sections apply only from the workspace root, so these entries
# reach this repository's own builds but not a consumer's;
# `rust/leptoskit/README.md` documents the entries a consumer adds. Keep
# every entry at the same rev, and the same rev for any leptoskit crate you
# depend on directly, so the graph holds one leptoskit checkout.
[patch.crates-io]
leptoskit = { git = "https://github.com/leptoskit/leptoskit", rev = "a93214edc8e5f6c7999c628285093f15cf188639" }
leptoskit_native = { git = "https://github.com/leptoskit/leptoskit", rev = "a93214edc8e5f6c7999c628285093f15cf188639" }
leptoskit_testing = { git = "https://github.com/leptoskit/leptoskit", rev = "a93214edc8e5f6c7999c628285093f15cf188639" }

[workspace.lints.rust]
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# The engine mirrors the Dart and TypeScript ports operation for operation,
# so it converts between float and integer counts on purpose.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
# `(a + b) / 2.0` is what the other engines compute; `f64::midpoint` can
# differ in the last bit.
manual_midpoint = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
tabs_in_doc_comments = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
# Glob imports of a component library are leptoskit's idiom, as in
# `use skribble_leptoskit::*`.
wildcard_imports = "allow"
