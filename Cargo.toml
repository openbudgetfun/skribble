[workspace]
members = ["rust/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr."]
edition = "2024"
homepage = "https://openbudgetfun.github.io/skribble/"
license = "MIT"
repository = "https://github.com/openbudgetfun/skribble"
rust-version = "1.88.0"

[workspace.dependencies]
skribble_leptoskit = { path = "rust/leptoskit", version = "0.1.0" }
skribble_rough = { path = "rust/rough", version = "0.1.0" }

leptos = { version = "0.9.0-rc1", default-features = false }
# LeptosKit main, commit "feat: adopt Exact's performance budgets (#770)"
# (10 Nov 2026). These three crates are the ones this workspace uses.
# The git rev is the pin; bump them together, and only here. There is no
# `[patch]` override. See `rust/leptoskit/README.md`.
leptoskit = { git = "https://github.com/leptoskit/leptoskit", rev = "1f7f1462a17a9a33eccb933909f6cdae20d03052", default-features = false }
leptoskit_native = { git = "https://github.com/leptoskit/leptoskit", rev = "1f7f1462a17a9a33eccb933909f6cdae20d03052", default-features = false }
leptoskit_testing = { git = "https://github.com/leptoskit/leptoskit", rev = "1f7f1462a17a9a33eccb933909f6cdae20d03052" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# The engine mirrors the Dart and TypeScript ports operation for operation,
# so it converts between float and integer counts on purpose.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
# `(a + b) / 2.0` is what the other engines compute; `f64::midpoint` can
# differ in the last bit.
manual_midpoint = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
tabs_in_doc_comments = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
# Glob imports of a component library are leptoskit's idiom, as in
# `use skribble_leptoskit::*`.
wildcard_imports = "allow"
