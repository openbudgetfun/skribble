[workspace]
members = ["rust/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["Ifiok Jr."]
edition = "2024"
homepage = "https://openbudgetfun.github.io/skribble/"
license = "MIT"
repository = "https://github.com/openbudgetfun/skribble"
rust-version = "1.88.0"

[workspace.dependencies]
skribble_rough = { path = "rust/rough", version = "0.0.1" }

# leptoskit is not on crates.io yet, so every crate in the workspace pins the
# same commit. Bump `rev` here, and only here, to follow leptoskit's `main`.
leptos = { version = "0.8", default-features = false }
leptoskit = { git = "https://github.com/ifiokjr/leptoskit", rev = "ad19e75ab44b4d93807c5be1e565c769269d87d8", default-features = false }
leptoskit_native = { git = "https://github.com/ifiokjr/leptoskit", rev = "ad19e75ab44b4d93807c5be1e565c769269d87d8", default-features = false }
leptoskit_testing = { git = "https://github.com/ifiokjr/leptoskit", rev = "ad19e75ab44b4d93807c5be1e565c769269d87d8" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# The engine mirrors the Dart and TypeScript ports operation for operation,
# so it converts between float and integer counts on purpose.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
# `(a + b) / 2.0` is what the other engines compute; `f64::midpoint` can
# differ in the last bit.
manual_midpoint = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
tabs_in_doc_comments = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
# Glob imports of a component library are leptoskit's idiom, as in
# `use skribble_leptoskit::*`.
wildcard_imports = "allow"
