name: skribble_benchmark
description: >
  Measures what it costs to draw skribble icons, roughened at runtime or
  painted from pre-computed paths.
publish_to: none
environment:
  sdk: ^3.13.0
  flutter: ^3.41.0
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  skribble:
    path: ../../packages/skribble
  skribble_font_noto_sketch:
    path: ../../packages/skribble_font_noto_sketch
  skribble_font_recursive:
    path: ../../packages/skribble_font_recursive
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
