name: skribble_storybook
description: >
  Interactive showcase app for the Skribble hand-drawn UI component library.
  Demonstrates all 80+ widgets across component category pages and a rough-icons gallery.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.41.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  skribble:
    path: ../../packages/skribble
  skribble_charts:
    path: ../../packages/skribble_charts
  skribble_emoji:
    path: ../../packages/skribble_emoji
  skribble_icons:
    path: ../../packages/skribble_icons
  skribble_maps:
    path: ../../packages/skribble_maps

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.3.0
  patrol_finders: ^3.1.0
  skribble_lints:
    path: ../../packages/skribble_lints

  test_api: any
patrol:
  # Test suite location — Patrol discovers both patrolTest (native runner)
  # and plain integration tests here.
  test_directory_path: integration_test
  verbose: false
  android:
    package_name: fun.openbudget.skribble_storybook

flutter:
  uses-material-design: true
  fonts:
    - family: Skribble
      fonts:
        - asset: assets/fonts/Skribble-Bold.ttf
          weight: 700
        - asset: assets/fonts/Skribble-BoldItalic.ttf
          style: italic
          weight: 700
        - asset: assets/fonts/Skribble-Italic.ttf
          style: italic
        - asset: assets/fonts/Skribble-Regular.ttf
