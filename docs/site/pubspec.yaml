name: skribble_docs_site
description: Interactive Flutter documentation for the Skribble design system.
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.1
  markdown: ^7.3.1
  skribble:
    path: ../../packages/skribble
  url_launcher: ^6.3.2
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.3.0
  patrol_finders: ^3.1.0
  skribble_lints:
    path: ../../packages/skribble_lints

  test_api: any
patrol:
  test_directory_path: integration_test

flutter:
  uses-material-design: true
  assets:
    - content/
    - content/core/
    - content/getting-started/
    - content/guides/
    - content/reference/
    - content/showcase/
    - content/widgets/
