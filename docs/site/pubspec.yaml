name: skribble_docs_site
description: Interactive Flutter documentation for the Skribble design system.
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.1
  highlight: ^0.7.0
  markdown: ^7.3.1
  skribble:
    path: ../../packages/skribble
  skribble_emoji:
    path: ../../packages/skribble_emoji
  skribble_icons:
    path: ../../packages/skribble_icons
  skribble_maps:
    path: ../../packages/skribble_maps
  url_launcher: ^6.3.2
  yaml: ^3.1.3

dev_dependencies:
  analyzer: ^13.3.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.3.0
  patrol_finders: ^3.1.0
  skribble_lints:
    path: ../../packages/skribble_lints

  test_api: any
patrol:
  test_directory_path: integration_test

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/RECURSIVE-OFL.txt
    - content/
    - content/core/
    - content/getting-started/
    - content/guides/
    - content/reference/
    - content/showcase/
    - content/widgets/
  fonts:
    - family: RecursiveCasualOriginal
      fonts:
        - asset: assets/fonts/RecursiveSansCslSt-Regular.ttf
        - asset: assets/fonts/RecursiveSansCslSt-Bold.ttf
          weight: 700
        - asset: assets/fonts/RecursiveSansCslSt-Italic.ttf
          style: italic
        - asset: assets/fonts/RecursiveSansCslSt-BoldItalic.ttf
          weight: 700
          style: italic
    - family: RecursiveLinearOriginal
      fonts:
        - asset: assets/fonts/RecursiveSansLnrSt-Regular.ttf
        - asset: assets/fonts/RecursiveSansLnrSt-Bold.ttf
          weight: 700
        - asset: assets/fonts/RecursiveSansLnrSt-Italic.ttf
          style: italic
        - asset: assets/fonts/RecursiveSansLnrSt-BoldItalic.ttf
          weight: 700
          style: italic
    - family: SkribbleLinearGentle
      fonts:
        - asset: assets/fonts/SkribbleLinearGentle-Regular.ttf
        - asset: assets/fonts/SkribbleLinearGentle-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleLinearGentle-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleLinearGentle-BoldItalic.ttf
          weight: 700
          style: italic
    - family: SkribbleLinearPlayful
      fonts:
        - asset: assets/fonts/SkribbleLinearPlayful-Regular.ttf
        - asset: assets/fonts/SkribbleLinearPlayful-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleLinearPlayful-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleLinearPlayful-BoldItalic.ttf
          weight: 700
          style: italic
    - family: SkribbleLinearExpressive
      fonts:
        - asset: assets/fonts/SkribbleLinearExpressive-Regular.ttf
        - asset: assets/fonts/SkribbleLinearExpressive-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleLinearExpressive-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleLinearExpressive-BoldItalic.ttf
          weight: 700
          style: italic
