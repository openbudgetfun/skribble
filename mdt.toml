[padding]
before = 0
after = 0

[templates]
paths = ["templates"]

# Values providers can render, so version requirements are read from the
# manifests instead of being typed into the docs. With `[data]` configured,
# providers are minijinja templates: wrap a literal `{{` in
# `{% raw %}...{% endraw %}`.
[data]
skribble = "packages/skribble/pubspec.yaml" # {{ skribble.environment.flutter }}
fvm = { path = ".fvmrc", format = "json" } # {{ fvm.flutter }}

[include]
# Make sure the library sources and test helpers are scanned so shared
# dartdoc blocks can be synced from the templates.
patterns = [
  "packages/skribble/lib/**/*.dart",
  "packages/skribble/test/helpers/*.dart",
]

# Keep mdt-written markdown converged with dprint's canonical formatting so
# `mdt check` stays green after `fix:format` runs.
[[formatters]]
command = "dprint fmt --stdin \"{{ filePath }}\""
patterns = ["**/*.md", "**/*.t.md"]

[exclude]
patterns = [
  # CLAUDE.md is a symlink to AGENTS.md; scan the real file once.
  "CLAUDE.md",
  "docs/agents/**",
  "**/.dart_tool/**",
  "**/build/**",
  "**/coverage/**",
  "**/.git/**",
  "**/.claude/**",
  "**/node_modules/**",
  "js/*/dist/**",
]
markdown_codeblocks = true
