# :schema https://monochange.github.io/monochange/schemas/monochange.schema.json

# =============================================================================
# monochange.toml — repository configuration for monochange
# =============================================================================

[defaults]
parent_bump = "patch"
include_private = false
warn_on_group_mismatch = true
package_type = "dart"

[defaults.changelog]
path = "{{ path }}/CHANGELOG.md"
format = "keep_a_changelog"
initial_header = """
# Changelog

All notable changes to this project will be documented in this file.

This changelog is managed by [monochange](https://github.com/monochange/monochange).
"""

# =============================================================================
# [package.*] — declare each release-managed package explicitly
# =============================================================================

[package.skribble]
path = "packages/skribble"
type = "dart"
tag = true
release = true
bump_propagation = "inherit"

[package.skribble_icons]
path = "packages/skribble_icons"
type = "dart"

[package.skribble_icons_custom]
path = "packages/skribble_icons_custom"
type = "dart"

[package.skribble_emoji]
path = "packages/skribble_emoji"
type = "dart"

[package.skribble_emoji_gen]
path = "packages/skribble_emoji_gen"
type = "dart"

[package.skribble_font_roughen]
path = "packages/skribble_font_roughen"
type = "dart"

[package.skribble_lints]
path = "packages/skribble_lints"
type = "dart"

[package.skribble_maps]
path = "packages/skribble_maps"
type = "dart"
tag = true
release = true
version_format = "namespaced"

[package.skribble_charts]
path = "packages/skribble_charts"
type = "dart"
tag = true
release = true
version_format = "namespaced"

# =============================================================================
# [group.*] — version groups that share a single release identity
# =============================================================================

[group.main]
packages = [
  "skribble",
  "skribble_icons",
  "skribble_icons_custom",
  "skribble_emoji",
  "skribble_emoji_gen",
  "skribble_font_roughen",
  "skribble_lints",
]
tag = true
release = true
version_format = "primary"
changelog = { path = "CHANGELOG.md" }

# Dependents of main-group packages inherit the group's own release
# severity, never exceeding a major bump. Without a declaration they only
# received the legacy `parent_bump = "patch"` floor, so a major release of
# `group.main` left dependents on stale dependency ranges behind a patch.
bump_propagation = "inherit"
bump_propagation_max = "major"

# =============================================================================
# [ecosystems.*] — per-ecosystem discovery and publishing settings
# =============================================================================

[ecosystems.dart]
enabled = true
publish.enabled = true
publish.mode = "builtin"
publish.registry = "pub_dev"
# `flutter pub publish --dry-run` for the larger packages (skribble,
# skribble_emoji) takes well over the default timeout on cold caches.
publish.timeout.timeout_seconds = 600
publish.timeout.retries = 1
publish.trusted_publishing = { enabled = true, repository = "openbudgetfun/skribble", workflow = "publish.yml", environment = "publisher" }
versioned_files = [
  { path = "**/pubspec.yaml", type = "dart", fields = ["dependencies", "dev_dependencies"] },
]

# =============================================================================
# [source] — repository host for release automation
# =============================================================================

[source]
provider = "github"
owner = "openbudgetfun"
repo = "skribble"

[source.releases]
enabled = true
source = "monochange"
branches = ["main"]
enforce_for_tags = true
enforce_for_publish = true
enforce_for_commit = false

[source.pull_requests]
enabled = true
branch_prefix = "chore/release"
base = "main"
title = "chore(release): prepare release"
# The prefix must stay stable while a release PR is open: renaming it orphans
# the long-running PR, and recreating it fails on GitHub's 65536-character
# PR body limit because the pending 0.1.0 changesets exceed it.
# Requires monochange with commit_subject support (monochange#675).
commit_subject = "🔖 chore(release): prepare release"
labels = ["release", "automated"]
auto_merge = false

# =============================================================================
# [changesets.affected] — changeset verification settings
# =============================================================================

[changesets.affected]
enabled = true
required = true
skip_labels = []
comment_on_failure = true
changed_paths = []
ignored_paths = ["**/CHANGELOG.md"]

# =============================================================================
# [lints] — manifest lint configuration
# =============================================================================

[lints]
# `changesets/recommended` adds `changesets/prefer-inline` and
# `changesets/summary-description` on top of the explicit rules below;
# `dart/recommended` covers pubspec metadata and publishability hygiene.
use = ["changesets/recommended", "dart/recommended"]

[lints.rules]
"dart/internal-path-dependency-policy" = "off"
"dart/dependency-sorted" = "error"
"dart/assets-sorted" = "error"
"dart/workspace-internal-version-consistency" = "error"
"dart/no-unexpected-dependency-overrides" = "warning"
"changesets/duplicate" = "error"
"changesets/no_section_headings" = "error"
"changesets/summary" = { level = "error", required = true, heading_level = 1, min_length = 8, max_length = 90, forbid_trailing_period = true, forbid_conventional_commit_prefix = true }
"changesets/bump/major" = { level = "error", min_body_chars = 120, require_code_block = true }
"changesets/bump/minor" = { level = "error", min_body_chars = 80 }
"changesets/bump/patch" = { level = "error", min_body_chars = 80 }
"changesets/bump/none" = { level = "error", min_body_chars = 80 }
"changesets/types/breaking" = { level = "error", required_bump = "major", forbidden_headings = [
  "Breaking",
  "Breaking change",
  "Breaking changes",
] }
"changesets/types/major" = { level = "error", required_bump = "major", forbidden_headings = [
  "Major",
  "Breaking",
  "Breaking change",
  "Breaking changes",
] }
"changesets/types/feat" = { level = "error", required_bump = "minor", forbidden_headings = ["Feat", "Feature"] }
"changesets/types/fix" = { level = "error", required_bump = "patch", forbidden_headings = ["Fix", "Fixed"] }

# =============================================================================
# [cli.*] — user-defined CLI commands
# =============================================================================

[cli.document]
help_text = "Create a changeset file and format workspace files"
steps = [
  { type = "CreateChangeFile", name = "create changeset" },
  { type = "Command", name = "format with dart format", command = "dart format ." },
]

[cli.release]
help_text = "Prepare, commit, and open or refresh the grouped Skribble release pull request"
steps = [
  { type = "PrepareRelease", name = "prepare release", allow_empty_changesets = true, inputs = { format = "json" } },
  { type = "Command", name = "format release files", when = "{{ number_of_changesets > 0 }}", command = "fix:format", shell = true },
  { type = "CommitRelease", name = "commit release", when = "{{ number_of_changesets > 0 }}", inputs = { no_verify = true } },
  { type = "OpenReleaseRequest", name = "open release request", when = "{{ number_of_changesets > 0 }}", inputs = { no_verify = true } },
]

[cli.publish-check]
help_text = "Preview package publishing in dry-run mode against pub.dev"
steps = [
  { type = "Command", name = "dry-run package publishing", command = "monochange step publish-packages --dry-run --all --format json" },
]
