# :schema https://monochange.github.io/monochange/schemas/monochange.schema.json

# =============================================================================
# monochange.toml — repository configuration for monochange
# =============================================================================

[defaults]
parent_bump = "patch"
include_private = false
warn_on_group_mismatch = true
package_type = "dart"

[defaults.changelog]
path = "{{ path }}/CHANGELOG.md"
format = "keep_a_changelog"
initial_header = """
# Changelog

All notable changes to this project will be documented in this file.

This changelog is managed by [monochange](https://github.com/monochange/monochange).
"""

# =============================================================================
# [package.*] — declare each release-managed package explicitly
# =============================================================================

[package.skribble]
path = "packages/skribble"
type = "dart"
tag = true
release = true
bump_propagation = "inherit"

[package.skribble_icons]
path = "packages/skribble_icons"
type = "dart"

[package.skribble_icons_simple]
path = "packages/skribble_icons_simple"
type = "dart"

[package.skribble_icons_material]
path = "packages/skribble_icons_material"
type = "dart"

[package.skribble_icons_lucide]
path = "packages/skribble_icons_lucide"
type = "dart"

[package.skribble_icons_bxs]
path = "packages/skribble_icons_bxs"
type = "dart"

[package.skribble_icons_cib]
path = "packages/skribble_icons_cib"
type = "dart"

[package.skribble_emoji]
path = "packages/skribble_emoji"
type = "dart"

[package.skribble_emoji_gen]
path = "packages/skribble_emoji_gen"
type = "dart"

[package.skribble_font_noto]
path = "packages/skribble_font_noto"
type = "dart"

[package.skribble_font_noto_sketch]
path = "packages/skribble_font_noto_sketch"
type = "dart"

[package.skribble_font_noto_lively]
path = "packages/skribble_font_noto_lively"
type = "dart"

[package.skribble_font_recursive]
path = "packages/skribble_font_recursive"
type = "dart"

[package.skribble_font_roughen]
path = "packages/skribble_font_roughen"
type = "dart"

[package.skribble_lints]
path = "packages/skribble_lints"
type = "dart"

[package.skribble_rough]
path = "packages/skribble_rough"
type = "dart"

[package.skribble_jaspr]
path = "packages/skribble_jaspr"
type = "dart"

[package.skribble_maps]
path = "packages/skribble_maps"
type = "dart"
tag = true
release = true
version_format = "namespaced"

[package.skribble_charts]
path = "packages/skribble_charts"
type = "dart"
tag = true
release = true
version_format = "namespaced"

# The website: the skribble.dev landing page, which also carries the docs and
# the storybook when it deploys. It is never published to a registry. Its
# release tag, `skribble_site/v<version>`, gets a GitHub release, and every
# release deploys the website (scripts/release/deploy_website.sh). Notes for
# people who visit the site use the `user` stream below.
[package.skribble_site]
path = "apps/skribble_site"
type = "dart"
tag = true
release = true
version_format = "namespaced"
publish = { enabled = false }
release_title = "skribble.dev v{{ version }} ({{ date }})"
changelog_version_title = "[{{ version }}]({{ tag_url }}) ({{ date }})"

# The npm packages in js/. Their internal dependencies are plain semver ranges
# ("^0.1.0") that monochange rewrites on each release; see
# pnpm-workspace.yaml for how pnpm still links them locally.
[package."@skribble.dev/rough"]
path = "js/rough"
type = "npm"

[package."@skribble.dev/react"]
path = "js/react"
type = "npm"

[package."@skribble.dev/react-native"]
path = "js/react-native"
type = "npm"

[package."@skribble.dev/vue"]
path = "js/vue"
type = "npm"

[package."@skribble.dev/svelte"]
path = "js/svelte"
type = "npm"

# =============================================================================
# [group.*] — version groups that share a single release identity
# =============================================================================

[group.main]
packages = [
  "skribble",
  "skribble_icons",
  "skribble_icons_simple",
  "skribble_icons_material",
  "skribble_icons_lucide",
  "skribble_icons_bxs",
  "skribble_icons_cib",
  "skribble_emoji",
  "skribble_emoji_gen",
  "skribble_font_noto",
  "skribble_font_noto_sketch",
  "skribble_font_noto_lively",
  "skribble_font_recursive",
  "skribble_font_roughen",
  "skribble_lints",
  "skribble_rough",
  "skribble_jaspr",
]
tag = true
release = true
version_format = "primary"
changelog = { path = "CHANGELOG.md" }

# Dependents of main-group packages inherit the group's own release
# severity, never exceeding a major bump. Without a declaration they only
# received the legacy `parent_bump = "patch"` floor, so a major release of
# `group.main` left dependents on stale dependency ranges behind a patch.
bump_propagation = "inherit"
bump_propagation_max = "major"

# The npm packages share one version and release under their own `js/v<version>`
# tag, so a JavaScript release never waits on, or forces, a Dart release.
[group.js]
packages = [
  "@skribble.dev/rough",
  "@skribble.dev/react",
  "@skribble.dev/react-native",
  "@skribble.dev/vue",
  "@skribble.dev/svelte",
]
tag = true
release = true
version_format = "namespaced"
release_title = "npm packages v{{ version }} ({{ date }})"
changelog = { path = "js/CHANGELOG.md" }

# =============================================================================
# [changelog.*] — audience streams
# =============================================================================

# The `default` stream is the developer changelog every package keeps. The
# `user` stream is for people visiting skribble.dev: what they can see or do
# that they could not before. A changeset picks its stream through its type,
# so `skribble_site: user_feat` lands in the user notes and
# `skribble_site: fix` in the site's developer changelog. Write one file per
# audience when a change needs both.
[changelog.streams.user]
description = "What visitors to skribble.dev notice: new pages, demos, and fixes they can see"

[changelog.types.user_feat]
bump = "minor"
section = "feat"
stream = "user"
description = "Something new that visitors to skribble.dev can see or try"

[changelog.types.user_fix]
bump = "patch"
section = "fix"
stream = "user"
description = "A problem visitors to skribble.dev could see, now fixed"

[changelog.outputs.user]
stream = "user"
targets = ["skribble_site"]
format = "keep_a_changelog"
mode = "append"
path = "docs/site/content/reference/whats-new.md"

# =============================================================================
# [ecosystems.*] — per-ecosystem discovery and publishing settings
# =============================================================================

[ecosystems.dart]
enabled = true
publish.enabled = true
publish.mode = "builtin"
publish.registry = "pub_dev"
# `flutter pub publish --dry-run` for the larger packages (skribble,
# skribble_emoji) takes well over the default timeout on cold caches.
publish.timeout.timeout_seconds = 600
publish.timeout.retries = 1
publish.trusted_publishing = { enabled = true, mode = "preferred", repository = "openbudgetfun/skribble", workflow = "publish.yml", environment = "publisher" }
versioned_files = [
  { path = "**/pubspec.yaml", type = "dart", fields = ["dependencies", "dev_dependencies"] },
]

[ecosystems.npm]
enabled = true
# Refresh pnpm-lock.yaml after monochange rewrites versions and internal ranges.
lockfile_commands = [{ command = "pnpm install --lockfile-only" }]
publish.enabled = true
publish.mode = "builtin"
publish.registry = "npm"
# `preferred`, as for Dart: CI publishes with trusted publishing, while the
# one-time local placeholder publish can still use an `npm login` session.
publish.trusted_publishing = { enabled = true, mode = "preferred", repository = "openbudgetfun/skribble", workflow = "publish.yml", environment = "publisher" }

# =============================================================================
# [source] — repository host for release automation
# =============================================================================

[source]
provider = "github"
owner = "openbudgetfun"
repo = "skribble"

[source.releases]
enabled = true
source = "monochange"
branches = ["main"]
enforce_for_tags = true
enforce_for_publish = true
enforce_for_commit = false

[source.pull_requests]
enabled = true
branch_prefix = "chore/release"
base = "main"
title = "chore(release): prepare release"
# The prefix must stay stable while a release PR is open: renaming it orphans
# the long-running PR, and recreating it has hit GitHub's 65536-character PR
# body limit for large changeset sets.
# Requires monochange with commit_subject support (monochange#675).
commit_subject = "🔖 chore(release): prepare release"
labels = ["release", "automated"]
auto_merge = false

# =============================================================================
# [changesets.affected] — changeset verification settings
# =============================================================================

[changesets.affected]
enabled = true
required = true
skip_labels = []
comment_on_failure = true
changed_paths = []
ignored_paths = ["**/CHANGELOG.md"]

# =============================================================================
# [lints] — manifest lint configuration
# =============================================================================

[lints]
# `changesets/recommended` adds `changesets/prefer-inline` and
# `changesets/summary-description` on top of the explicit rules below;
# `dart/recommended` covers pubspec metadata and publishability hygiene.
use = ["changesets/recommended", "dart/recommended"]

[lints.rules]
"dart/internal-path-dependency-policy" = "off"
"dart/dependency-sorted" = "error"
"dart/assets-sorted" = "error"
"dart/workspace-internal-version-consistency" = "error"
"dart/no-unexpected-dependency-overrides" = "warning"
# The npm packages in js/ deliberately differ from three npm defaults:
# - internal dependencies are plain ranges that monochange rewrites, because
#   `npm publish` ships a `workspace:` range unchanged;
# - `repository` stays an object with `directory`, the form npm provenance
#   checks against this repository, which the rule reads as empty;
# - each framework is both a peer dependency and a dev dependency, so the
#   package tests against the framework it declares.
"npm/workspace-protocol" = "off"
"npm/manifest-repository" = "off"
"npm/no-duplicate-dependencies" = "off"
"changesets/duplicate" = "error"
"changesets/no_section_headings" = "error"
"changesets/summary" = { level = "error", required = true, heading_level = 1, min_length = 8, max_length = 90, forbid_trailing_period = true, forbid_conventional_commit_prefix = true }
"changesets/bump/major" = { level = "error", min_body_chars = 120, require_code_block = true }
"changesets/bump/minor" = { level = "error", min_body_chars = 80 }
"changesets/bump/patch" = { level = "error", min_body_chars = 80 }
"changesets/bump/none" = { level = "error", min_body_chars = 80 }
"changesets/types/breaking" = { level = "error", required_bump = "major", forbidden_headings = [
  "Breaking",
  "Breaking change",
  "Breaking changes",
] }
"changesets/types/major" = { level = "error", required_bump = "major", forbidden_headings = [
  "Major",
  "Breaking",
  "Breaking change",
  "Breaking changes",
] }
"changesets/types/feat" = { level = "error", required_bump = "minor", forbidden_headings = ["Feat", "Feature"] }
"changesets/types/fix" = { level = "error", required_bump = "patch", forbidden_headings = ["Fix", "Fixed"] }

# =============================================================================
# [cli.*] — user-defined CLI commands
# =============================================================================

[cli.document]
help_text = "Create a changeset file and format workspace files"
steps = [
  { type = "CreateChangeFile", name = "create changeset" },
  { type = "Command", name = "format with dart format", command = "dart format ." },
]

[cli.release-local]
help_text = "Prepare a local release: plan bumps, sync files, format, then commit, tag, and publish the GitHub release"
inputs = [
  { name = "format", type = "choice", choices = ["text", "json", "markdown"], default = "markdown" },
  { name = "no_verify", type = "boolean", default = true },
  { name = "commit", help_text = "Whether to commit the release changes", type = "boolean", default = false },
  { name = "push", help_text = "Whether to push the release commit after committing", type = "boolean", default = false },
  { name = "tag", help_text = "Whether to create and push release tags from the release commit", type = "boolean", default = false },
  { name = "publish_release", help_text = "Whether to publish the GitHub release objects for the release tags", type = "boolean", default = false },
]
steps = [
  { type = "PrepareRelease", name = "plan release", allow_empty_changesets = true },
  { type = "Command", name = "sync dependency versions", when = "{{ number_of_changesets > 0 }}", command = "monochange versions sync" },
  { type = "Command", name = "format release files", when = "{{ number_of_changesets > 0 }}", command = "devenv shell fix:format" },
  { type = "CommitRelease", name = "create release commit", when = "{{ number_of_changesets > 0 && inputs.commit }}", inputs = { no_verify = "{{ inputs.no_verify }}", stage_all = true } },
  { type = "Command", name = "push release commit", when = "{{ number_of_changesets > 0 && inputs.commit && inputs.push }}", command = "git push --no-verify" },
  { type = "TagRelease", name = "create and push release tags", when = "{{ number_of_changesets > 0 && inputs.commit && inputs.tag }}", inputs = { from = "HEAD", push = true, format = "json" } },
  { type = "PublishRelease", name = "publish GitHub releases", when = "{{ number_of_changesets > 0 && inputs.commit && inputs.tag && inputs.publish_release }}", inputs = { from-ref = "HEAD", draft = false, format = "json" } },
  # Font zips are attached by the publish workflow's `v<version>` job. Releases
  # prepared locally bypass that job, so the assets are uploaded here instead,
  # along with the animated emoji exported as Lottie files.
  { type = "Command", name = "attach font release assets", when = "{{ number_of_changesets > 0 && inputs.commit && inputs.tag && inputs.publish_release }}", command = "devenv shell publish:fonts" },
  { type = "Command", name = "attach animated emoji release asset", when = "{{ number_of_changesets > 0 && inputs.commit && inputs.tag && inputs.publish_release }}", command = "devenv shell publish:emoji-lottie" },
]

# Automated releases: this is what the release workflow runs on every push to
# main, with MONOCHANGE_RELEASE_BACKEND=hosted. It prepares the release, and
# the monochange GitHub App commits it on the `chore/release/release` branch
# and opens or refreshes the release pull request. The command must be named
# `release`: monochange.dev only replaces a release branch named
# `<branch_prefix>/release`. Both commits stage every workspace change
# (`stage_all`): staging release files only left the changelogs, versions, and
# consumed changesets out of the release commit. Merging that pull request is
# a release commit, which a maintainer tags with `publish:tags`.
[cli.release]
help_text = "Prepare, commit, and open or refresh the automated release pull request"
steps = [
  { type = "PrepareRelease", name = "prepare release", allow_empty_changesets = true, inputs = { format = "json" } },
  { type = "Command", name = "format release files", when = "{{ number_of_changesets > 0 }}", command = "fix:format", shell = true },
  { type = "CommitRelease", name = "commit release", when = "{{ number_of_changesets > 0 }}", inputs = { no_verify = true, stage_all = true } },
  { type = "OpenReleaseRequest", name = "open release request", when = "{{ number_of_changesets > 0 }}", inputs = { no_verify = true, stage_all = true } },
]

[cli.publish]
help_text = "Publish the packages recorded in the current release"
steps = [
  { type = "PublishPackages", name = "publish packages" },
]
