name: skribble
description: |
  Hand-drawn UI components for Flutter. 80+ sketchy widgets with familiar Material and Cupertino APIs — buttons, inputs, navigation, dialogs, and more, all with a hand-drawn aesthetic.
version: 0.1.0
homepage: https://github.com/openbudgetfun/skribble
repository: https://github.com/openbudgetfun/skribble/tree/main/packages/skribble
documentation: https://github.com/openbudgetfun/skribble/blob/main/packages/skribble/README.md
issue_tracker: https://github.com/openbudgetfun/skribble/issues
topics:
  - ui
  - widgets
  - hand-drawn
  - design-system
  - sketch
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  path_parsing: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  skribble_lints: ^0.1.0
  xml: ^6.6.1
flutter:
  uses-material-design: true
  fonts:
    - family: ArchitectsDaughter
      fonts:
        - asset: assets/fonts/ArchitectsDaughter-Regular.ttf
    - family: Skribble
      fonts:
        - asset: assets/fonts/Skribble-Bold.ttf
          weight: 700
        - asset: assets/fonts/Skribble-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Skribble-Italic.ttf
          style: italic
        - asset: assets/fonts/Skribble-Regular.ttf
    - family: SkribbleGentle
      fonts:
        - asset: assets/fonts/SkribbleGentle-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleGentle-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SkribbleGentle-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleGentle-Regular.ttf
    - family: SkribbleLinearExpressive
      fonts:
        - asset: assets/fonts/SkribbleLinearExpressive-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleLinearExpressive-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SkribbleLinearExpressive-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleLinearExpressive-Regular.ttf
    - family: SkribbleLinearGentle
      fonts:
        - asset: assets/fonts/SkribbleLinearGentle-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleLinearGentle-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SkribbleLinearGentle-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleLinearGentle-Regular.ttf
    - family: SkribbleLinearPlayful
      fonts:
        - asset: assets/fonts/SkribbleLinearPlayful-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleLinearPlayful-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SkribbleLinearPlayful-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleLinearPlayful-Regular.ttf
    - family: SkribbleMonoExpressive
      fonts:
        - asset: assets/fonts/SkribbleMonoExpressive-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleMonoExpressive-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SkribbleMonoExpressive-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleMonoExpressive-Regular.ttf
    - family: SkribbleMonoGentle
      fonts:
        - asset: assets/fonts/SkribbleMonoGentle-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleMonoGentle-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SkribbleMonoGentle-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleMonoGentle-Regular.ttf
    - family: SkribbleMonoPlayful
      fonts:
        - asset: assets/fonts/SkribbleMonoPlayful-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribbleMonoPlayful-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SkribbleMonoPlayful-Italic.ttf
          style: italic
        - asset: assets/fonts/SkribbleMonoPlayful-Regular.ttf
    - family: SkribblePlayful
      fonts:
        - asset: assets/fonts/SkribblePlayful-Bold.ttf
          weight: 700
        - asset: assets/fonts/SkribblePlayful-BoldItalic.ttf
