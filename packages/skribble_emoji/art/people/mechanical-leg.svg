    <path data-part="socket" d="M12.2 2.6 L25.8 2.6 L24.6 12.4 Q19 15 13.4 12.4 Z" fill="grey"/>
    <rect x="15.6" y="13.4" width="5.6" height="15" rx="1.4" ry="1.4" fill="silver"/>
    <path d="M21.2 16 L21.2 27 Q21.2 28.4 19.8 28.4 L19.4 28.4 C20 24.6 20.4 20 21.2 16 Z" fill="grey" stroke="none"/>
