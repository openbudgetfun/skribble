    <path data-part="foot" d="M15 27.2 L22.4 27.2 C23.8 27.2 24.6 28.2 24.6 29.6 L24.6 31.2 Q24.6 33 22.8 33 L7.4 33 C5.4 33 5 30.2 7 29.6 Z" fill="silver"/>
