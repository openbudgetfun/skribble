<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" stroke-linecap="round" stroke-linejoin="round">
  <!-- The monkey head the three wise monkeys share: ears, brown head with
       its shade, and the tan face mask. Each monkey draws its own eyes,
       nose, mouth, and hands on top. -->
  <g id="ears" stroke="ink">
    <circle cx="5.6" cy="17.6" r="3.8" fill="brown"/>
    <circle cx="30.4" cy="17.6" r="3.8" fill="brown"/>
    <circle cx="5.8" cy="17.8" r="2" fill="tan" stroke="none"/>
    <circle cx="30.2" cy="17.8" r="2" fill="tan" stroke="none"/>
  </g>
  <g id="head">
    <circle cx="18" cy="18.4" r="13.6" fill="brown"/>
    <path d="M30.4 12.9 A13.6 13.6 0 0 1 18 32 C24.9 29.6 29.4 22.6 30.4 12.9 Z" fill="brown-shade"/>
    <circle cx="18" cy="18.4" r="13.6" fill="none" stroke="ink"/>
    <path d="M18 11.6 C19.4 9.8 21 9.6 22.6 9.6 C26 9.6 27.6 12.4 27.4 15.4 C27.2 17.4 26.4 18.4 26.2 19.6 C27.4 21.2 27.6 23 27 24.8 C25.6 29 21.8 30.6 18 30.6 C14.2 30.6 10.4 29 9 24.8 C8.4 23 8.6 21.2 9.8 19.6 C9.6 18.4 8.8 17.4 8.6 15.4 C8.4 12.4 10 9.6 13.4 9.6 C15 9.6 16.6 9.8 18 11.6 Z" fill="tan"/>
  </g>
</svg>
