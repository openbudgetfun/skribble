<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" stroke-linecap="round" stroke-linejoin="round">
  <!-- One dancer in bunny ears, centred on x = 10.8, for with-bunny-ears.
       Include it twice; the second copy moves right and takes the skin2
       tokens. -->
  <g id="legs" fill="none">
    <path d="M9.4 25.4 L8.8 33 M12.2 25.4 L12.8 33" stroke="ink" stroke-width="4.4"/>
    <path d="M9.4 25.4 L8.8 33 M12.2 25.4 L12.8 33" stroke="skin" stroke-width="2.8"/>
  </g>
  <path id="leotard" d="M7.6 26 L7.8 19.6 Q8 16.8 10.8 16.8 Q13.6 16.8 13.8 19.6 L14 26 Q10.8 27.4 7.6 26 Z" fill="black" stroke="ink" stroke-width="1.75"/>
  <g id="arms" fill="none">
    <path d="M8.2 18.6 L5.6 21.8 L8 24.2 M13.4 18.6 L16 21.8 L13.6 24.2" stroke="ink" stroke-width="4"/>
    <path d="M8.2 18.6 L5.6 21.8 L8 24.2 M13.4 18.6 L16 21.8 L13.6 24.2" stroke="skin" stroke-width="2.4"/>
  </g>
  <g data-include="head" transform="translate(0.72 4.784) scale(0.56)"/>
  <g id="ears" stroke="ink" stroke-width="1.5">
    <path d="M7 10.4 Q10.8 6.6 14.6 10.4" fill="none" stroke-width="1.75"/>
    <ellipse cx="8.6" cy="5.4" rx="1.7" ry="3.6" transform="rotate(-14 8.6 5.4)" fill="black"/>
    <ellipse cx="13" cy="5.4" rx="1.7" ry="3.6" transform="rotate(14 13 5.4)" fill="black"/>
    <ellipse cx="8.6" cy="5.2" rx="0.7" ry="2.2" transform="rotate(-14 8.6 5.4)" fill="pink" stroke="none"/>
    <ellipse cx="13" cy="5.2" rx="0.7" ry="2.2" transform="rotate(14 13 5.4)" fill="pink" stroke="none"/>
  </g>
</svg>
