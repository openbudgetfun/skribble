<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" stroke-linecap="round" stroke-linejoin="round">
  <!-- A child for family art, drawn on the shared head's grid (head centre
       (18, 13.6), radius 7.4) with a small body below. Families include it
       at about half size, so its lines are drawn heavier than usual.
       Hair: person = child, man = boy, woman = girl with bunches. -->
  <g id="body" stroke="ink" stroke-width="2.6">
    <path d="M7.6 34.6 C8 26.8 12 22.6 18 22.6 C24 22.6 28 26.8 28.4 34.6 Z" fill="blue"/>
    <path d="M24.6 25 C27 27.2 28.2 30.4 28.4 34.6 L24.8 34.6 C25.6 31 25.6 27.8 24.6 25 Z" fill="blue-shade" stroke="none"/>
    <path d="M7.6 34.6 C8 26.8 12 22.6 18 22.6 C24 22.6 28 26.8 28.4 34.6 Z" fill="none"/>
  </g>
  <g id="bunches" data-variant="woman" fill="hair" stroke="ink" stroke-width="2.4">
    <path d="M11.4 10.2 C7.4 9.6 4.6 12.8 5 18.6 C8.6 17.8 11 15.2 11.8 12.6 Z"/>
    <path d="M24.6 10.2 C28.6 9.6 31.4 12.8 31 18.6 C27.4 17.8 25 15.2 24.2 12.6 Z"/>
  </g>
  <g id="head">
    <circle cx="18" cy="13.6" r="7.4" fill="skin" stroke="ink" stroke-width="2.6"/>
    <circle cx="15" cy="14.6" r="1.25" fill="ink"/>
    <circle cx="21" cy="14.6" r="1.25" fill="ink"/>
    <ellipse cx="13.2" cy="17.4" rx="1.4" ry="0.85" fill="cheek"/>
    <ellipse cx="22.8" cy="17.4" rx="1.4" ry="0.85" fill="cheek"/>
    <path d="M16 18 Q18 19.6 20 18" fill="none" stroke="ink" stroke-width="2"/>
  </g>
  <g id="hair" fill="hair" stroke="ink" stroke-width="2.4">
    <path data-variant="person" d="M10.8 13 C10.4 8 13.8 5.6 18 5.6 C22.2 5.6 25.6 8 25.2 13 C23.4 11.4 21.4 10.2 18.8 10 C16.2 11.2 13.6 12 10.8 13 Z"/>
    <path data-variant="man" d="M10.7 12.8 C10.4 7.8 13.6 5.6 18 5.6 C22.4 5.6 25.6 7.8 25.3 12.8 C24 10.6 21.6 9.8 18 9.8 C14.4 9.8 12 10.6 10.7 12.8 Z"/>
    <path data-variant="man" d="M16.8 5.8 C16.6 3.4 18.4 2 20.8 2.6 C19.4 3.4 19.2 4.6 19.8 5.8 Z"/>
    <path data-variant="woman" d="M10.6 13.2 C10.4 7.6 13.6 5.2 18 5.2 C22.4 5.2 25.6 7.6 25.4 13.2 C23.8 10.6 21.2 9 18 8.8 C15.8 10.4 13.4 11.8 10.6 13.2 Z"/>
  </g>
</svg>
