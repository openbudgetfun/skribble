<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" stroke-linecap="round" stroke-linejoin="round">
  <!-- b11: a clock face centred on (18, 18), radius 14: white dial, a silver
       crescent on the lower right, the ink rim, and four hour ticks. Clocks
       include it (scaled into their case) and draw their own ink `hands`. -->
