    <circle cx="18" cy="18" r="15" fill="none" stroke="ink"/>
    <path d="M18 5 L18 7.2 M31 18 L28.8 18 M18 31 L18 28.8 M5 18 L7.2 18" fill="none" stroke="ink" stroke-width="1.75"/>
  </g>
</svg>
