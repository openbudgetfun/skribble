<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" stroke-linecap="round" stroke-linejoin="round">
  <!-- A snowman with a top hat, stick arms, scarf, and carrot nose. -->
  <g id="arms" fill="none">
    <path d="M11 22.4 L4.2 16.6 M6.4 18.4 L5.4 15 M25 22.4 L31.8 16.6 M29.6 18.4 L30.6 15" stroke="ink" stroke-width="3.4"/>
    <path d="M11 22.4 L4.2 16.6 M6.4 18.4 L5.4 15 M25 22.4 L31.8 16.6 M29.6 18.4 L30.6 15" stroke="brown" stroke-width="1.4"/>
  </g>
  <g id="body" stroke="ink">
    <circle cx="18" cy="25.6" r="8" fill="white"/>
    <path d="M25.3 22.34 A8 8 0 0 1 18 33.6 C22.06 32.22 24.72 28.06 25.3 22.34 Z" fill="silver" stroke="none"/>
    <circle cx="18" cy="25.6" r="8" fill="none"/>
    <circle cx="18" cy="24.6" r="1" fill="ink" stroke="none"/>
    <circle cx="18" cy="28.8" r="1" fill="ink" stroke="none"/>
  </g>
  <g id="head" stroke="ink">
    <circle cx="18" cy="13.4" r="6.2" fill="white"/>
    <path d="M23.66 10.88 A6.2 6.2 0 0 1 18 19.6 C21.14 18.53 23.21 15.3 23.66 10.88 Z" fill="silver" stroke="none"/>
    <circle cx="18" cy="13.4" r="6.2" fill="none"/>
    <circle cx="15.8" cy="12.4" r="1.05" fill="ink" stroke="none"/>
    <circle cx="20.6" cy="12.4" r="1.05" fill="ink" stroke="none"/>
    <path data-part="nose" d="M18.2 14.4 L12.6 15.8 L18.2 16.4 Z" fill="orange" stroke-width="1.25"/>
  </g>
  <g id="scarf" fill="red" stroke="ink" stroke-width="1.5">
    <path d="M21 20.4 L22.4 25.8 L25 25 L23.4 19.8 Z"/>
    <path d="M12 18.6 Q18 21.4 24 18.6 L24.2 21 Q18 24 11.8 21 Z"/>
  </g>
  <g id="hat" stroke="ink" transform="rotate(-8 18 8)">
    <rect x="13.2" y="1.6" width="9.6" height="6.4" rx="1" ry="1" fill="black"/>
    <path d="M13.4 6.2 L22.6 6.2" fill="none" stroke="red" stroke-width="1.5"/>
    <rect x="10.6" y="7.4" width="14.8" height="2.4" rx="1.2" ry="1.2" fill="black" stroke-width="1.75"/>
  </g>
