<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" stroke-linecap="round" stroke-linejoin="round">
  <!-- The speaker for the four speaker emoji: a box and cone facing right,
       spanning x 3.4–18.8. Waves or a mute mark go on the right. -->
  <defs>
    <clipPath id="cone"><path d="M9.6 12.8 L17 6.2 Q18.8 5 18.8 7 L18.8 29 Q18.8 31 17 29.8 L9.6 23.2 Z"/></clipPath>
  </defs>
  <g id="speaker" stroke="ink">
    <rect x="3.4" y="12.6" width="6.8" height="10.8" rx="1.6" ry="1.6" fill="grey"/>
    <path d="M9.6 12.8 L17 6.2 Q18.8 5 18.8 7 L18.8 29 Q18.8 31 17 29.8 L9.6 23.2 Z" fill="silver" stroke="none"/>
    <path d="M20 8 Q17.4 24 8 26 L20 32 Z" fill="grey" stroke="none" clip-path="url(#cone)"/>
    <path d="M9.6 12.8 L17 6.2 Q18.8 5 18.8 7 L18.8 29 Q18.8 31 17 29.8 L9.6 23.2 Z" fill="none"/>
    <path d="M12.2 14.6 L15.4 11.6" fill="none" stroke="paper" stroke-width="1.75"/>
  </g>
</svg>
