<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" stroke-linecap="round" stroke-linejoin="round">
  <!-- Two stacked banknotes in green. Currency notes include it, remap the
       green tokens, and draw their glyph in the medallion at (18, 15.8). -->
  <g id="notes" stroke="ink">
    <rect x="4.2" y="10.6" width="27.6" height="17.6" rx="2.4" ry="2.4" fill="green-shade" transform="rotate(8 18 19)"/>
    <rect x="3" y="6.6" width="30" height="18.4" rx="2.4" ry="2.4" fill="green" stroke="none"/>
    <path d="M33 15.4 L33 22.6 Q33 25 30.6 25 L15 25 C24.6 23.8 30.6 20.8 33 15.4 Z" fill="green-shade" stroke="none"/>
    <rect x="5.8" y="9.4" width="24.4" height="12.8" rx="1.2" ry="1.2" fill="none" stroke="green-shade" stroke-width="1.25"/>
    <rect x="3" y="6.6" width="30" height="18.4" rx="2.4" ry="2.4" fill="none"/>
    <circle cx="18" cy="15.8" r="5.6" fill="mint" stroke-width="1.5"/>
    <circle cx="8.8" cy="12.4" r="1.4" fill="mint" stroke-width="1.25"/>
    <circle cx="27.2" cy="19.2" r="1.4" fill="mint" stroke-width="1.25"/>
  </g>
</svg>
