<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" stroke-linecap="round" stroke-linejoin="round">
  <!-- A white pictogram of a person dropping litter into a bin, for the
       blue litter sign. Remap white to ink for the prohibition sign. -->
  <g id="person" fill="none" stroke="white">
    <path d="M11.8 13.6 L11.4 21" stroke-width="4"/>
    <path d="M11.4 21 L9.4 28.6 M11.4 21 L13.6 28.6" stroke-width="3"/>
    <path d="M11.2 15 L8.4 19.8" stroke-width="2.6"/>
    <path data-part="hand" d="M12.4 14.8 L17.8 16.6" stroke-width="2.6"/>
    <circle cx="11.8" cy="9.4" r="2.6" fill="white" stroke="none"/>
  </g>
  <rect data-part="litter" x="19.4" y="17.8" width="2.6" height="2.6" rx="0.4" ry="0.4" fill="white" transform="rotate(20 20.7 19.1)"/>
  <g id="bin" fill="white" stroke="white">
    <path d="M19.6 22.4 L28.2 22.4 L27 29.2 L20.8 29.2 Z" stroke="none"/>
    <path d="M18.6 21.6 L29.2 21.6" fill="none" stroke-width="2"/>
  </g>
</svg>
