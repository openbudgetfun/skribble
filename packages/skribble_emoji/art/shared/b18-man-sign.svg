    <circle cx="18" cy="8.4" r="2.8"/>
    <rect x="14.4" y="12.2" width="7.2" height="9.8" rx="2" ry="2"/>
    <rect x="11.4" y="12.6" width="2.3" height="8.6" rx="1.15" ry="1.15"/>
    <rect x="22.3" y="12.6" width="2.3" height="8.6" rx="1.15" ry="1.15"/>
    <rect x="14.6" y="20.4" width="3" height="9" rx="1.3" ry="1.3"/>
    <rect x="18.4" y="20.4" width="3" height="9" rx="1.3" ry="1.3"/>
  </g>
</svg>
