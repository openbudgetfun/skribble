    <circle cx="18" cy="18" r="15" fill="none" stroke="ink"/>
  </g>
  <g id="brows" fill="none" stroke="ink" stroke-width="1.75">
    <path d="M8.6 10.2 Q11.4 9.6 14 7.6"/>
