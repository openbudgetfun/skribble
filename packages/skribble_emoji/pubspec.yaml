name: skribble_emoji
description: |
  skribble's own hand-drawn emoji: every Unicode 18 emoji, drawn for skribble and inked live by the theme pen, with skin tones, a themeable palette, and inline emoji text.
version: 0.3.1
homepage: https://github.com/openbudgetfun/skribble
repository: https://github.com/openbudgetfun/skribble/tree/main/packages/skribble_emoji
documentation: https://github.com/openbudgetfun/skribble/blob/main/packages/skribble_emoji/README.md
issue_tracker: https://github.com/openbudgetfun/skribble/issues
topics:
  - ui
  - emoji
  - hand-drawn
  - design-system
  - sketch
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace
dependencies:
  characters: ^1.4.0
  flutter:
    sdk: flutter
  path_parsing: ^1.1.0
  skribble: ^0.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  skribble_emoji_gen: ^0.3.1
  skribble_lints: ^0.3.1
flutter:
  uses-material-design: true
