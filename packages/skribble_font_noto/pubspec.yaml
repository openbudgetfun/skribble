name: skribble_font_noto
description: |
  Skribble Noto: a hand-drawn typeface generated from Google Noto Sans (Soft
  level), for Latin, Greek and Cyrillic. Every other Noto script is in the
  Skribble Noto font kit.
version: 0.4.0
homepage: https://github.com/openbudgetfun/skribble
repository: https://github.com/openbudgetfun/skribble/tree/main/packages/skribble_font_noto
documentation: https://github.com/openbudgetfun/skribble/blob/main/packages/skribble_font_noto/README.md
issue_tracker: https://github.com/openbudgetfun/skribble/issues
topics:
  - fonts
  - hand-drawn
  - design-system
  - noto
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: SkribbleNoto
      fonts:
        - asset: assets/fonts/SkribbleNoto-Regular.ttf
