name: skribble_icons
description: |
  Every skribble hand-drawn icon set behind one import. Aggregates the
  curated, Simple Icons, Material, Lucide, Boxicons, and CoreUI Brands catalogs
  with a unified lookup.
version: 0.2.0
homepage: https://github.com/openbudgetfun/skribble
repository: https://github.com/openbudgetfun/skribble/tree/main/packages/skribble_icons
documentation: https://github.com/openbudgetfun/skribble/blob/main/packages/skribble_icons/README.md
issue_tracker: https://github.com/openbudgetfun/skribble/issues
topics:
  - ui
  - icons
  - hand-drawn
  - design-system
  - sketch
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  skribble: ^0.2.0
  skribble_icons_bxs: ^0.2.0
  skribble_icons_cib: ^0.2.0
  skribble_icons_curated: ^0.2.0
  skribble_icons_lucide: ^0.2.0
  skribble_icons_material: ^0.2.0
  skribble_icons_simple: ^0.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  skribble_lints: ^0.2.0
flutter:
  uses-material-design: true
