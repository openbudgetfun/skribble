name: skribble_icons
description: |
  Hand-drawn icon set for Skribble. A curated SVG-manifest-based icon package generated with the Skribble rough icon pipeline.
version: 0.3.4
homepage: https://github.com/openbudgetfun/skribble
repository: https://github.com/openbudgetfun/skribble/tree/main/packages/skribble_icons
documentation: https://github.com/openbudgetfun/skribble/blob/main/packages/skribble_icons/README.md
issue_tracker: https://github.com/openbudgetfun/skribble/issues
topics:
  - ui
  - icons
  - hand-drawn
  - design-system
  - sketch
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  skribble: ^0.3.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  skribble_lints: ^0.3.4
flutter:
  uses-material-design: true
