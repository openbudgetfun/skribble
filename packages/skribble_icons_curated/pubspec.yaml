name: skribble_icons_curated
description: |
  Curated hand-drawn simple icon set for skribble. Thirty app-level icons
  generated from SVG sources through the shared rough pass.
version: 0.1.1
homepage: https://github.com/openbudgetfun/skribble
repository: https://github.com/openbudgetfun/skribble/tree/main/packages/skribble_icons_curated
documentation: https://github.com/openbudgetfun/skribble/blob/main/packages/skribble_icons_curated/README.md
issue_tracker: https://github.com/openbudgetfun/skribble/issues
topics:
  - ui
  - icons
  - hand-drawn
  - design-system
  - sketch
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  skribble: ^0.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  skribble_lints: ^0.1.1
flutter:
  uses-material-design: true
