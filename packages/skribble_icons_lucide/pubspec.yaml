name: skribble_icons_lucide
description: |
  Lucide icon set for Skribble, rendered as precomputed hand-drawn
  geometry. The Lucide outline icon set: 1,837 icons plus 219 aliases at a uniform 2px stroke.
version: 0.1.1
homepage: https://github.com/openbudgetfun/skribble
repository: https://github.com/openbudgetfun/skribble/tree/main/packages/skribble_icons_lucide
documentation: https://github.com/openbudgetfun/skribble/blob/main/packages/skribble_icons_lucide/README.md
issue_tracker: https://github.com/openbudgetfun/skribble/issues
topics:
  - ui
  - icons
  - hand-drawn
  - design-system
  - sketch
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  skribble: ^0.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  skribble_lints: ^0.1.1
