    sdk: flutter
  flutter_hooks: ^0.21.3
  latlong2: ">=0.9.1 <0.11.0"
  maplibre_gl: ^0.27.0
  skribble: ^0.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  skribble_lints: ^0.1.1
flutter:
  uses-material-design: true
