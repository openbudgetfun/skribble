name: skribble_rough
description: |
  The pure-Dart hand-drawn rendering engine behind skribble. Generates seeded rough shapes, hachure fills, and pen strokes, and serializes them to SVG path data with no Flutter dependency.
version: 0.4.0
homepage: https://github.com/openbudgetfun/skribble
repository: https://github.com/openbudgetfun/skribble/tree/main/packages/skribble_rough
documentation: https://openbudgetfun.github.io/skribble/
issue_tracker: https://github.com/openbudgetfun/skribble/issues
topics:
  - hand-drawn
  - sketch
  - svg
  - graphics
environment:
  sdk: ^3.13.0
resolution: workspace
dev_dependencies:
  skribble_lints: ^0.4.0
  test: ^1.24.0
