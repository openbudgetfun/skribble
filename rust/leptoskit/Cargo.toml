[package]
name = "skribble_leptoskit"
version = "0.1.1"
authors.workspace = true
categories = ["gui", "wasm", "web-programming"]
edition.workspace = true
homepage.workspace = true
keywords = ["hand-drawn", "sketch", "leptoskit", "leptos", "skribble"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/openbudgetfun/skribble/tree/main/rust/leptoskit"
rust-version.workspace = true
description = "Hand-drawn leptoskit components from the skribble design system: rough borders, sketched fills, pen marks, and doodles."

[dependencies]
leptoskit = { workspace = true }
skribble_rough = { workspace = true }

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }
leptoskit_native = { workspace = true, features = ["web"] }
leptoskit_testing = { workspace = true }

[lints]
workspace = true
