[package]
name = "skribble_leptoskit_charts"
version = "0.1.1"
authors.workspace = true
categories = ["gui", "wasm", "web-programming"]
edition.workspace = true
homepage.workspace = true
keywords = ["hand-drawn", "charts", "leptoskit", "leptos", "skribble"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/openbudgetfun/skribble/tree/main/rust/leptoskit_charts"
rust-version.workspace = true
description = "Hand-drawn financial charts for leptoskit: candlesticks, lines, bars, volume, and technical indicators."

[dependencies]
leptoskit = { workspace = true }
skribble_leptoskit = { workspace = true }
skribble_rough = { workspace = true }

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }
leptoskit_native = { workspace = true, features = ["web"] }
leptoskit_testing = { workspace = true }

[lints]
workspace = true
