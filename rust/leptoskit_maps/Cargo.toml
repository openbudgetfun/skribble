[package]
name = "skribble_leptoskit_maps"
version = "0.1.1"
authors.workspace = true
categories = ["gui", "wasm", "web-programming"]
edition.workspace = true
homepage.workspace = true
keywords = ["hand-drawn", "sketch", "leptoskit", "maps", "skribble"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/openbudgetfun/skribble/tree/main/rust/leptoskit_maps"
rust-version.workspace = true
description = "Hand-drawn vector maps for leptoskit apps from the skribble design system: sketched areas, routes, pins, and zoom controls."

[dependencies]
leptoskit = { workspace = true }
skribble_leptoskit = { workspace = true }
skribble_rough = { workspace = true }

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }
leptoskit_native = { workspace = true, features = ["web"] }
leptoskit_testing = { workspace = true }

[lints]
workspace = true
